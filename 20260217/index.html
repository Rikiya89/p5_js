<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacred Geometry — Black & White 3D Generative Art</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: #000000;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(20, 20, 20, 0.9);
      padding: 15px;
      border-radius: 8px;
      color: #cccccc;
      z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    button {
      background: #333333;
      color: white;
      border: 1px solid #555;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #555555;
    }
    button:disabled {
      background: #1a1a1a;
      color: #666;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #aaaaaa;
    }
    #info {
      font-size: 11px;
      color: #888888;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div><strong>Sacred Geometry</strong></div>
    <button id="startBtn" onclick="startRecording()">Start Recording</button>
    <button id="stopBtn" onclick="stopRecording()" disabled>Stop Recording</button>
    <div id="status">Ready</div>
    <div id="info">
      Duration: <span id="duration">0</span>s / <span id="maxDuration">30</span>s<br>
      Frames: <span id="frameCount">0</span><br>
      Format: MP4 (60fps)
    </div>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
