<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacred Geometry</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: #000;
      font-family: monospace;
    }
    canvas {
      display: block;
    }
    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(20, 20, 20, 0.88);
      padding: 15px;
      border-radius: 6px;
      color: #ccc;
      z-index: 100;
      border: 1px solid #333;
    }
    button {
      background: #222;
      color: #eee;
      border: 1px solid #555;
      padding: 8px 16px;
      margin: 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-family: monospace;
    }
    button:hover { background: #444; }
    button:disabled { background: #111; color: #555; cursor: not-allowed; }
    #status { margin-top: 8px; font-size: 12px; color: #aaa; }
    #info { font-size: 11px; color: #666; margin-top: 8px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="controls">
    <div><strong>Sacred Geometry</strong></div>
    <button id="startBtn" onclick="startRecording()">Start Recording</button>
    <button id="stopBtn" onclick="stopRecording()" disabled>Stop Recording</button>
    <div id="status">Ready</div>
    <div id="info">
      Duration: <span id="duration">0</span>s / <span id="maxDuration">24</span>s<br>
      Frames: <span id="frameCount">0</span><br>
      Format: MP4 (60fps)<br>
      Shortcut: Press R to start/stop
    </div>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
