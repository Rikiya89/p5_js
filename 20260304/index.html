<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio-Synthetic Fourier</title>
  <script src="../p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a0f0d;
      font-family: monospace;
      overflow: hidden;
    }
    canvas { display: block; }
    #controls {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(10, 15, 13, 0.88);
      padding: 14px 16px;
      border-radius: 6px;
      color: #aaa;
      z-index: 100;
      border: 1px solid #1a2e1f;
    }
    #controls strong {
      color: #00ff87;
      letter-spacing: 0.08em;
      font-size: 13px;
    }
    button {
      background: #0d1f14;
      color: #00ff87;
      border: 1px solid #1a4028;
      padding: 7px 14px;
      margin: 4px 2px 0 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: monospace;
      letter-spacing: 0.05em;
    }
    button:hover  { background: #112b1a; border-color: #00ff87; }
    button:disabled { background: #080f0a; color: #2a4a32; cursor: not-allowed; border-color: #111; }
    #status { margin-top: 8px; font-size: 12px; color: #00ff87; }
    #info   { font-size: 11px; color: #3a5a42; margin-top: 6px; line-height: 1.7; }
    #info span { color: #5a8a62; }
  </style>
</head>
<body>
  <div id="controls">
    <div><strong>BIO-SYNTHETIC FOURIER</strong></div>
    <button id="startBtn" onclick="startRecording()">⏺ Record</button>
    <button id="stopBtn"  onclick="stopRecording()" disabled>⏹ Stop</button>
    <div id="status">Ready</div>
    <div id="info">
      Duration: <span id="duration">0.0</span>s / <span id="maxDuration">24</span>s<br>
      Frames:   <span id="frameCount">0</span><br>
      Canvas:   <span id="canvasSize">—</span><br>
      Format:   MP4 · 60 fps · H.264<br>
      Shortcut: <span>R</span> to start / stop
    </div>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
