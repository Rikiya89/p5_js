<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mersenne Bloom</title>
  <script src="../p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 42%, rgba(0, 255, 135, 0.10), transparent 34%),
        radial-gradient(circle at 30% 18%, rgba(123, 47, 255, 0.12), transparent 28%),
        linear-gradient(145deg, rgba(26, 26, 46, 0.62), rgba(10, 15, 13, 1) 52%, rgba(13, 33, 55, 0.84));
      font-family: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      box-shadow:
        0 28px 120px rgba(0, 0, 0, 0.55),
        0 0 90px rgba(0, 212, 255, 0.08);
    }
    #controls {
      position: fixed;
      top: 18px;
      left: 18px;
      min-width: 240px;
      background: linear-gradient(165deg, rgba(10, 15, 13, 0.82), rgba(13, 33, 55, 0.32));
      padding: 15px 16px 14px;
      border-radius: 16px;
      color: #9db3ab;
      z-index: 100;
      border: 1px solid rgba(176, 255, 232, 0.12);
      backdrop-filter: blur(18px);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(224, 247, 255, 0.06);
    }
    #controls strong {
      color: #00ff87;
      letter-spacing: 0.14em;
      font-size: 12px;
      font-weight: 600;
    }
    #controls > div:first-child { margin-bottom: 8px; }
    button {
      background: linear-gradient(180deg, rgba(13, 59, 46, 0.34), rgba(10, 15, 13, 0.95));
      color: #00ff87;
      border: 1px solid rgba(0, 255, 135, 0.18);
      padding: 8px 14px;
      margin: 4px 6px 0 0;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 0.08em;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease, color 160ms ease;
    }
    button:hover  {
      background: linear-gradient(180deg, rgba(13, 59, 46, 0.5), rgba(10, 15, 13, 0.96));
      border-color: rgba(0, 255, 135, 0.42);
      transform: translateY(-1px);
    }
    button:disabled {
      background: rgba(8, 15, 10, 0.92);
      color: #2a4a32;
      cursor: not-allowed;
      border-color: rgba(17, 17, 17, 0.8);
      transform: none;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #00ff87;
      letter-spacing: 0.05em;
    }
    #info {
      font-size: 11px;
      color: #4f6961;
      margin-top: 7px;
      line-height: 1.75;
    }
    #info span { color: #82bca8; }
  </style>
</head>
<body>
  <div id="controls">
    <div><strong>MERSENNE BLOOM</strong></div>
    <button id="startBtn" onclick="startRecording()">⏺ Record</button>
    <button id="stopBtn"  onclick="stopRecording()" disabled>⏹ Stop</button>
    <div id="status">Ready</div>
    <div id="info">
      Duration: <span id="duration">0.0</span>s / <span id="maxDuration">24</span>s<br>
      Frames:   <span id="frameCount">0</span><br>
      Canvas:   <span id="canvasSize">—</span><br>
      Formula:  <span>M<sub>p</sub> = 2<sup>p</sup> - 1</span><br>
      Format:   MP4 · 60 fps · H.264 · WEBGL<br>
      Shortcut: <span>R</span> to start / stop
    </div>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
