<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lo Shu Magic Square</title>
  <script src="../p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.10), transparent 24%),
        radial-gradient(circle at 24% 18%, rgba(255, 255, 255, 0.05), transparent 22%),
        linear-gradient(155deg, rgba(10, 10, 10, 1), rgba(0, 0, 0, 1) 54%, rgba(28, 28, 28, 1));
      font-family: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8e8e8;
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 1080 / 1920));
      height: min(100vh, calc(100vw * 1920 / 1080));
      box-shadow:
        0 26px 110px rgba(0, 0, 0, 0.72),
        0 0 90px rgba(255, 255, 255, 0.05);
    }
    #controls {
      position: fixed;
      top: 18px;
      left: 18px;
      min-width: 250px;
      background: linear-gradient(165deg, rgba(10, 10, 10, 0.88), rgba(26, 26, 26, 0.54));
      padding: 15px 16px 14px;
      border-radius: 16px;
      color: #bbbbbb;
      z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    #controls strong {
      color: #ffffff;
      letter-spacing: 0.14em;
      font-size: 12px;
      font-weight: 600;
    }
    #controls > div:first-child { margin-bottom: 8px; }
    button {
      background: linear-gradient(180deg, rgba(44, 44, 44, 0.72), rgba(10, 10, 10, 0.98));
      color: #f2f2f2;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px 14px;
      margin: 4px 6px 0 0;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 0.08em;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease, color 160ms ease;
    }
    button:hover {
      background: linear-gradient(180deg, rgba(78, 78, 78, 0.82), rgba(14, 14, 14, 0.98));
      border-color: rgba(255, 255, 255, 0.32);
      transform: translateY(-1px);
    }
    button:disabled {
      background: rgba(12, 12, 12, 0.92);
      color: #5a5a5a;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.08);
      transform: none;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #d8d8d8;
      letter-spacing: 0.05em;
    }
    #info {
      font-size: 11px;
      color: #8e8e8e;
      margin-top: 7px;
      line-height: 1.75;
    }
    #info span { color: #d6d6d6; }
    #downloadLink {
      display: inline-block;
      margin-top: 10px;
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.08em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      padding-bottom: 2px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div><strong>LO SHU SQUARE</strong></div>
    <button id="startBtn" onclick="startRecording()">Record</button>
    <button id="stopBtn" onclick="stopRecording()" disabled>Stop</button>
    <div id="status">Ready</div>
    <div id="info">
      Duration: <span id="duration">0.0</span>s / <span id="maxDuration">24</span>s<br>
      Frames:   <span id="frameCount">0</span><br>
      Canvas:   <span id="canvasSize">-</span><br>
      Formula:  <span>Lo Shu 3x3 &middot; sum = 15</span><br>
      Format:   MP4 · 60 fps · H.264 · WEBGL<br>
      Shortcut: <span>R</span> to start / stop
    </div>
    <a id="downloadLink" href="#" download hidden>Download MP4</a>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
